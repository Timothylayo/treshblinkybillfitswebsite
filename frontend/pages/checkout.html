<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Request | TreshBlinkybill Fits</title>
  <link rel="stylesheet" href="../styles/main.css"/>
  <link rel="stylesheet" href="../styles/animations.css"/>
  <link rel="icon" type="image/png" href="../assets/fitslogo.png"/>
  <style>
    body { background: var(--bg); font-family: var(--font-body); color: var(--text-dark); }
    
    .checkout-wrap { 
      max-width: 1000px; 
      margin: 40px auto; 
      padding: 0 var(--space-md); 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 30px; 
      animation: smoothEntrance 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    /* Left Side: Form */
    .form-section { background: var(--white); padding: 30px; border-radius: var(--radius-lg); border: 1px solid var(--border-2); box-shadow: 0 4px 20px rgba(10,31,68,0.03); }
    .form-section h2 { font-family: var(--font-display); font-size: 24px; color: var(--navy); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--navy); }
    .input-group input, .input-group select, .input-group textarea { 
      width: 100%; padding: 12px; border: 1px solid var(--border-2); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; background: var(--bg); outline: none; transition: border-color 0.2s;
    }
    .input-group input:focus, .input-group select:focus, .input-group textarea:focus { 
      border-color: var(--blue); background: var(--white); 
    }
    
    /* Right Side: Style Bag */
    .bag-section { background: #f8fafc; padding: 30px; border-radius: var(--radius-lg); border: 1px solid var(--border-2); height: fit-content; box-shadow: 0 4px 20px rgba(10,31,68,0.03); }
    .bag-section h3 { font-family: var(--font-display); font-size: 20px; color: var(--navy); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    
    .bag-item { display: flex; gap: 15px; background: var(--white); padding: 15px; border-radius: var(--radius-md); margin-bottom: 15px; border: 1px solid var(--border-2); align-items: center; }
    .bag-item__img { width: 70px; height: 70px; border-radius: var(--radius-sm); object-fit: cover; background: var(--navy-light); flex-shrink: 0; }
    .bag-item__details { flex: 1; }
    .bag-item__title { font-weight: 600; font-size: 14px; color: var(--navy); margin-bottom: 4px; }
    .bag-item__qty { font-size: 12px; color: var(--text-soft); }
    .remove-btn { background: none; border: none; color: var(--danger); font-size: 11px; cursor: pointer; padding: 0; margin-top: 6px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }

    .notice { font-size: 12px; color: var(--text-soft); margin-top: 20px; line-height: 1.6; padding: 15px; background: var(--white); border-radius: var(--radius-sm); border: 1px solid var(--border-2); }
    
    #submitBtn { width: 100%; margin-top: 20px; justify-content: center; padding: 14px 0; }

    @keyframes smoothEntrance {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media(max-width: 768px) {
      .checkout-wrap { grid-template-columns: 1fr; margin: 20px auto; }
      .bag-section { order: -1; } /* Puts the style bag on top on mobile */
    }
  </style>
</head>
<body>

  <!-- NAV SLOT -->
  <div id="nav-slot"></div>

  <div class="checkout-wrap">
    
    <!-- LEFT: Customer Form -->
    <div class="form-section">
      <h2><i class="bi bi-person-badge" style="color: var(--blue);"></i> Your Details</h2>
      <form id="requestForm">
        <div class="input-group">
          <label><i class="bi bi-person"></i> Full Name</label>
          <input type="text" id="custName" required placeholder="e.g. Emeka Johnson">
        </div>
        <div class="input-group">
          <label><i class="bi bi-telephone"></i> Phone Number</label>
          <input type="tel" id="custPhone" required placeholder="08012345678">
        </div>
        <div class="input-group">
          <label><i class="bi bi-whatsapp"></i> WhatsApp Number (For consultation)</label>
          <input type="tel" id="custWhatsApp" required placeholder="08012345678">
        </div>
        <div class="input-group">
          <label><i class="bi bi-truck"></i> Delivery Preference</label>
          <select id="deliveryMode">
            <option value="pickup">I will pick up at the store</option>
            <option value="dispatch">Dispatch Rider Delivery</option>
          </select>
        </div>
        <div class="input-group">
          <label><i class="bi bi-geo-alt"></i> Delivery Address (If dispatch is selected)</label>
          <textarea id="custAddress" rows="2" placeholder="Your full address..."></textarea>
        </div>
        <div class="input-group">
          <label><i class="bi bi-calendar-event"></i> Event Date & Special Notes (Optional)</label>
          <textarea id="custNotes" rows="2" placeholder="e.g. Wedding on Dec 12th. I want a velvet fabric..."></textarea>
        </div>

        <button type="submit" class="btn btn--mint btn--lg btn-with-icon" id="submitBtn">
          <i class="bi bi-check2-circle"></i> Submit Request
        </button>
      </form>
    </div>

    <!-- RIGHT: Style Bag Summary -->
    <div class="bag-section">
      <h3><i class="bi bi-bag-check" style="color: var(--navy);"></i> Your Style Bag</h3>
      <div id="bagItemsContainer">
        <!-- JS injects items here -->
      </div>
      
      <div class="notice">
        <strong><i class="bi bi-info-circle"></i> What happens next?</strong><br>
        1. We receive your style choices.<br>
        2. We contact you via WhatsApp to discuss fabrics and arrange your measurements.<br>
        3. We send you a finalized invoice with exact pricing.
      </div>
    </div>

  </div>

  <div id="footer-slot"></div>

  <script src="../api.js"></script>
  <script src="../services/services.js"></script>
  <script src="../config.js"></script>
  <script src="../utils.js"></script>
  <script src="../animations.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.TBF && TBF.ComponentLoader) {
        await TBF.ComponentLoader.init('checkout');
      }

      // Sync Phone and WhatsApp Fields
      const phoneInput = document.getElementById('custPhone');
      const whatsappInput = document.getElementById('custWhatsApp');
      let isWhatsappManuallyEdited = false;

      if (phoneInput && whatsappInput) {
        whatsappInput.addEventListener('input', () => {
          isWhatsappManuallyEdited = whatsappInput.value.length > 0;
        });

        phoneInput.addEventListener('input', (e) => {
          if (!isWhatsappManuallyEdited) {
            whatsappInput.value = e.target.value;
          }
        });
      }

      const cartItems = TBF.CartService.getItems();
      if (cartItems.length === 0) {
        alert("Your style bag is empty. Let's find you a great design!");
        window.location.href = "../index.html";
        return;
      }

      renderBagItems(cartItems);
      document.getElementById('requestForm').addEventListener('submit', handleSubmission);
    });

    function renderBagItems(items) {
      const container = document.getElementById('bagItemsContainer');
      container.innerHTML = items.map((item, index) => {
        let imgSrc = '';
        if (item.image) {
          let firstImage = item.image.split(',')[0].trim();
          if (firstImage.startsWith('data:image')) {
            imgSrc = firstImage; 
          } else if (firstImage.startsWith('http')) {
            imgSrc = firstImage; 
          } else {
            imgSrc = `${BACKEND_URL}${firstImage}`; 
          }
        }
        
        const imgTag = imgSrc ? `<img src="${imgSrc}" class="bag-item__img" alt="${item.name}">` : `<div class="bag-item__img" style="display:flex;align-items:center;justify-content:center;font-size:24px;">👔</div>`;

        return `
          <div class="bag-item">
            ${imgTag}
            <div class="bag-item__details">
              <div class="bag-item__title">${item.name} ${item.isCustom ? '<span style="font-size:10px; background:var(--mint); color:var(--navy); padding:2px 6px; border-radius:4px; margin-left:6px; font-weight:600;">Bespoke</span>' : ''}</div>
              <div class="bag-item__qty">Qty: ${item.qty} | Ref: ${item.designId}</div>
              <button type="button" class="remove-btn" onclick="removeItem(${index})"><i class="bi bi-trash3"></i> Remove</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.removeItem = function(index) {
      TBF.CartService.removeItem(index);
      window.location.reload(); 
    };

    function dataURLtoFile(dataurl, filename) {
      let arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
          bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
      while(n--){
          u8arr[n] = bstr.charCodeAt(n);
      }
      return new File([u8arr], filename, {type:mime});
    }

    async function handleSubmission(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processing Order...`;
      btn.disabled = true;

      try {
        const orderId = 'TBF-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000);
        
        const cartData = TBF.CartService.getItems().map((item, i) => {
          if (i === 0) item.notes = document.getElementById('custNotes').value;
          return item;
        });

        const payload = {
          id: orderId,
          customer: document.getElementById('custName').value,
          phone: document.getElementById('custPhone').value,
          whatsapp: document.getElementById('custWhatsApp').value,
          address: document.getElementById('custAddress').value,
          deliveryMode: document.getElementById('deliveryMode').value,
          cart: cartData
        };

        await TBF.OrderService.placeOrder(payload);

        TBF.CartService.clearCart();
        window.location.href = `success.html?id=${orderId}`;

      } catch (error) {
        alert("Failed to submit request. Please try again or contact us on WhatsApp.");
        btn.innerHTML = `<i class="bi bi-check2-circle"></i> Submit Request`;
        btn.disabled = false;
        console.error(error);
      }
    }
  </script>
</body>
</html>
